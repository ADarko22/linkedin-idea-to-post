name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d #v10.4.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies (including dev group)
        run: uv sync --no-build --locked --group dev

      - name: Lint and format check with Ruff
        run: |
          uv run --no-build --locked  ruff check .
          uv run --no-build --locked  ruff format --check .

      - name: Type check with mypy
        run: uv run --no-build --locked mypy src

      - name: Run tests with coverage
        run: uv run --no-build --locked pytest --cov=linkedin_idea_to_post --cov-report=xml:coverage.xml

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=adarko22-dev
            -Dsonar.projectKey=ADarko22_linkedin-idea-to-post
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=**/ui/**

  packaging-smoke-test:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d #v10.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #7.1.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Verify pip installation and entry points
        run: |
          python -m venv /tmp/pip-smoke-venv
          /tmp/pip-smoke-venv/bin/pip install --upgrade pip
          /tmp/pip-smoke-venv/bin/pip install dist/*.whl
          /tmp/pip-smoke-venv/bin/python -c "import linkedin_idea_to_post.ui.cli.app; print('cli import ok')"
          /tmp/pip-smoke-venv/bin/python -c "import linkedin_idea_to_post.ui.gui.app; print('gui import ok')"