[project]
name = "linkedin-idea-to-post"
version = "0.1.0"
description = "A multi-agent workflow that takes a raw user idea and transforms it into a high-impact LinkedIn post."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "ADarko22", email = "anelo.buono992@gmail.com" }
]
dependencies = [
    "click>=8.5.1",
    "crewai[google-genai]~=1.15.0",
    "nicegui>=4.0.0",
    "numpy>=1.24.0",
    "platformdirs>=4.2.0",
    "pydantic>=2.11.9,<2.13",
    "pydantic-settings>=2.16.2",
    "rich<15.0.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]

[project.urls]
Repository = "https://github.com/ADarko22/linkedin-idea-to-post"
Issues = "https://github.com/ADarko22/linkedin-idea-to-post/issues"

[project.scripts]
li2p = "linkedin_idea_to_post.ui.cli.app:cli"
li2p-gui = "linkedin_idea_to_post.ui.gui.app:main"


[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

######################################################################
# mypy:  static type checking
[tool.mypy]
python_version = 3.12
mypy_path = "src"
explicit_package_bases = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
check_untyped_defs = true
no_implicit_optional = true

# Per-module overrides for third-party libraries or legacy code
[[tool.mypy.overrides]]
module = []
ignore_errors = true

######################################################################
# ruff: linter and formatter
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# 1. Choose which rule categories to enable
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes (basic syntax, unused imports/variables)
    "I", # isort (import sorting)
    "B", # flake8-bugbear (common bugs/design-flaws)
    "C4", # flake8-comprehensions (better list/dict/set comprehensions)
    "UP", # pyupgrade (upgrades syntax to modern Python versions)
]

# 2. Specifically ignore rules you don't want flagged
ignore = [
    "E501", # Ignore line-length violations (let the formatter handle it)
]

# 3. Allow fixable rules to be auto-fixed on save/run
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Configure the code formatter style (matches Black by default)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

######################################################################
# pytest: testing framework
[tool.pytest.ini_options]
# 1. Set minimum required pytest version
minversion = "9.2.0"

# 2. Define default command line arguments
addopts = [
    "--import-mode=importlib", # Highly recommended for modern layouts
    "--strict-markers", # Errors out if you use an unregistered marker
    "--strict-config", # Errors out if a config option is invalid
    "-ra", # Show summary for all except passed tests
    "-v", # Verbose output
]

# 3. Specify directories where pytest should look for tests
testpaths = [
    "tests",
]

# 4. Filter or ignore specific warning patterns
filterwarnings = [
    "error", # Turn all warnings into errors (strict mode)
    "ignore::DeprecationWarning", # Ignore specific warnings if needed
    "ignore:.*unclosed.*:UserWarning", # Ignore via regex match
    "ignore:Cannot set an attribute on:ImportWarning", #Ignore specific warning on Crewai imports
]

# 5. Register custom test markers to prevent typos
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
